name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: |
        Describe the situation you run into, rather than only the solution you
        have in mind — it often leads to a better answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you be interested in implementing this?
      options:
        - label: I would like to work on this myself
          required: false

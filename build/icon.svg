<?xml version="1.0" encoding="UTF-8"?>
<!--
  GhostBot mascot — a Pac-Man-style ghost/squid.

  Source of truth for every generated icon: run `node scripts/make-icons.mjs`
  to rasterize this into build/icon.png (+ sizes) and to replace the vendored
  app icon. Do not hand-edit the generated PNGs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3140"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7ae7ff"/>
      <stop offset="55%" stop-color="#39c2f0"/>
      <stop offset="100%" stop-color="#1b8fd4"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app tile -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="url(#bg)"/>

  <!--
    Ghost body: domed head, straight sides, four tentacle scallops along the
    bottom. Drawn as one path so it scales cleanly at 16px.
  -->
  <path fill="url(#body)" d="
    M 48 196
    L 48 122
    a 80 80 0 0 1 160 0
    L 208 196
    q -10 14 -20 0
    q -10 -14 -20 0
    q -10 14 -20 0
    q -10 -14 -20 0
    q -10 14 -20 0
    q -10 -14 -20 0
    q -10 14 -20 0
    Z"/>

  <!-- eyes: white sclera + dark pupils looking slightly right -->
  <ellipse cx="103" cy="120" rx="20" ry="24" fill="#ffffff"/>
  <ellipse cx="157" cy="120" rx="20" ry="24" fill="#ffffff"/>
  <ellipse cx="110" cy="125" rx="9.5" ry="11" fill="#16202c"/>
  <ellipse cx="164" cy="125" rx="9.5" ry="11" fill="#16202c"/>
  <!-- catchlights -->
  <circle cx="105.5" cy="117" r="3.2" fill="#ffffff" opacity="0.95"/>
  <circle cx="159.5" cy="117" r="3.2" fill="#ffffff" opacity="0.95"/>
</svg>
